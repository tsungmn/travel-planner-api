name: build-and-deploy

on:
  push:
    branches: [main]

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.vars.outputs.image }}
      tag: ${{ steps.vars.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - id: vars
        run: |
          # GHCR 이미지 이름은 소문자여야 한다
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/travel-planner-api" >> "$GITHUB_OUTPUT"
          echo "tag=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.vars.outputs.image }}:${{ steps.vars.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/travel-planner-config
          token: ${{ secrets.CONFIG_REPO_TOKEN }}

      - name: config repo 의 이미지 태그 갱신
        env:
          IMAGE: ${{ needs.build.outputs.image }}
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          python3 - <<'PY'
          import os, pathlib, re
          p = pathlib.Path("overlays/prod/kustomization.yaml")
          s = p.read_text(encoding="utf-8")
          pattern = re.compile(r'(- name: ' + re.escape(os.environ["IMAGE"]) + r'\n\s+newTag: )"?[^"\n]*"?')
          new, n = pattern.subn(r'\1"' + os.environ["TAG"] + '"', s)
          assert n == 1, "kustomization.yaml 에서 이미지 항목을 찾지 못했습니다"
          p.write_text(new, encoding="utf-8")
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet; then
            git commit -am "api: ${TAG:0:7}"
            git pull --rebase
            git push
          fi
