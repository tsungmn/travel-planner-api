name: build-and-deploy

on:
  push:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

env:
  dockerimage_name: tsungmn/travel-planner-api
  dockerimage_tag: ${{ github.sha }}

jobs:
  # 테스트가 통과해야만 이미지를 만들어 배포한다. (실제 PostgreSQL 로 통합 테스트까지 돌린다)
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: test
          POSTGRES_DB: travel_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app -d travel_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # DB 이름에 test 가 들어 있어야 한다. (tests/conftest.py 가 public 스키마를 지우므로)
      TEST_DATABASE_URL: postgres://app:test@127.0.0.1:5432/travel_test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - run: pip install -r requirements.txt -r requirements-dev.txt

      - run: pytest -q

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: tsungmn
          password: ${{ secrets.DOCKER_PASSWORD }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.dockerimage_name }}:${{ env.dockerimage_tag }}
            ${{ env.dockerimage_name }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Config Repo 불러오기
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/travel-planner-config
          ref: main
          token: ${{ secrets.CONFIG_REPO_TOKEN }}

      - name: Kustomize 준비
        uses: imranismail/setup-kustomize@v2.0.0

      - name: Config Repo 이미지 값 업데이트 (Kustomize)
        run: |
          cd overlays/api
          kustomize edit set image ${{ env.dockerimage_name }}:${{ env.dockerimage_tag }}
          cat kustomization.yaml

      - name: Config Repo 변경사항 푸시
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet; then
            git commit -am "api: ${GITHUB_SHA:0:7}"
            git pull --rebase
            git push
          fi
