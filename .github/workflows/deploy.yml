name: build-and-deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

env:
  dockerimage_name: tsungmn/travel-planner-api
  dockerimage_tag: ${{ github.sha }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: tsungmn
          password: ${{ secrets.DOCKER_PASSWORD }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.dockerimage_name }}:${{ env.dockerimage_tag }}
            ${{ env.dockerimage_name }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Config Repo 불러오기
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/travel-planner-config
          ref: main
          token: ${{ secrets.CONFIG_REPO_TOKEN }}

      - name: Kustomize 준비
        uses: imranismail/setup-kustomize@v2.0.0

      - name: Config Repo 이미지 값 업데이트 (Kustomize)
        run: |
          cd overlays/api
          kustomize edit set image ${{ env.dockerimage_name }}:${{ env.dockerimage_tag }}
          cat kustomization.yaml

      - name: Config Repo 변경사항 푸시
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet; then
            git commit -am "api: ${GITHUB_SHA:0:7}"
            git pull --rebase
            git push
          fi
