name: travel-planner-api

services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER 가 필요합니다}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD 가 필요합니다}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB 가 필요합니다}
    volumes:
      - ./data/pg:/var/lib/postgresql/data
    ports:
      - "${DB_BIND_IP:?DB_BIND_IP 에 홈서버의 사설 IP 를 지정하세요}:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
